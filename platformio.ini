; PlatformIO Project Configuration File for Smart Volt
; Target: ESP32-S3-WROOM-1-N16R8 (16 MB Flash, 8 MB Octal PSRAM)

[platformio]
; La placa está conectada por el conector UART/COM (CH343 en COM6)
default_envs = devkit-uart

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Ethernet ENC28J60 (solo se usa si ENABLE_ETHERNET = 1 en src/eth.h)
lib_deps =
    jandrassy/EthernetENC@^2.0.4

; Configuración para módulo ESP32-S3-WROOM-1-N16R8
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

build_flags = 
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
    -I include

; ---------------------------------------------------------------------------
; Variante para la DevKitC-1 usando el conector "UART"/"COM" (convertidor USB-UART).
; Todo (consola, lecturas, comandos e IP de la página) sale por ese puerto.
; Selecciónala en PlatformIO o usa:  pio run -e devkit-uart -t upload
; ---------------------------------------------------------------------------
[env:devkit-uart]
extends = env:esp32-s3-devkitc-1
upload_port = COM6
monitor_port = COM6
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
    -I include

